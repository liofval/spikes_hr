<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SPIKES 2026 — 当日までのスケジュール</title>
<style>
  :root {
    --bg: #f6f7fb;
    --bg-elev: #ffffff;
    --line: #d6dbe3;
    --text: #1a1a1a;
    --muted: #6b7280;
    --primary: #2e5aa8;
    --task: #2e5aa8;
    --task-bg: #eef3fb;
    --event: #e11d48;
    --event-bg: #fff1f3;
    --done: #047857;
    --done-bg: #d1fae5;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --todo: #4b5563;
    --todo-bg: #e5e7eb;
    --tag-cat: #6d28d9;
    --tag-cat-bg: #ede9fe;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 96px; }
  .back { font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--text); }
  h1 { font-size: 28px; margin: 16px 0 8px; color: #1f3a68; font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); margin: 0 0 40px; font-size: 14px; }

  .year { font-size: 22px; font-weight: 800; margin: 40px 0 24px; color: #1f3a68; }
  .year:first-of-type { margin-top: 0; }

  .timeline { position: relative; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: var(--line);
    transform: translateX(-50%);
    z-index: 0;
  }

  .axis-headers {
    display: grid;
    grid-template-columns: 1fr 40px 1fr;
    gap: 16px;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }
  .axis-head {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .axis-head.tasks { color: var(--task); background: var(--task-bg); }
  .axis-head.events { color: var(--event); background: var(--event-bg); grid-column: 3; }

  .month-label {
    grid-column: 1 / -1;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin: 24px 0 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
  }

  .entry {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 40px 1fr;
    gap: 16px;
    margin-bottom: 18px;
    align-items: center;
  }
  .entry:last-child { margin-bottom: 0; }
  .entry.task > .card { grid-column: 1; }
  .entry.event > .card { grid-column: 3; }

  .dot {
    grid-column: 2;
    justify-self: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--line);
    z-index: 1;
  }
  .entry.task .dot { border-color: var(--task); background: var(--task); }
  .entry.event .dot { border-color: var(--event); background: var(--event); }

  .card {
    background: var(--bg-elev);
    border-radius: 12px;
    padding: 16px 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .entry.event .card {
    border-color: #f6cbd2;
    background: linear-gradient(135deg, #fff 0%, #fff5f7 100%);
  }

  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .head-icon { font-size: 16px; flex-shrink: 0; }
  .head-title { font-size: 15px; font-weight: 700; margin: 0; flex: 1; color: var(--text); }
  .entry.event .head-title { color: var(--event); }
  .head-date { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .desc { font-size: 13px; color: #4b5563; margin: 0 0 10px; line-height: 1.6; }
  .desc:last-child { margin-bottom: 0; }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
  .tag.task { background: var(--task-bg); color: var(--task); }
  .tag.event { background: var(--event-bg); color: var(--event); }
  .tag.cat { background: var(--tag-cat-bg); color: var(--tag-cat); }
  .tag.done { background: var(--done-bg); color: var(--done); }
  .tag.progress { background: var(--warn-bg); color: var(--warn); }
  .tag.todo { background: var(--todo-bg); color: var(--todo); }

  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
  .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 16px; border-radius: 8px; }

  @media (max-width: 720px) {
    .timeline::before { left: 12px; transform: none; }
    .axis-headers { grid-template-columns: 1fr; }
    .axis-head.events { grid-column: 1; }
    .entry { grid-template-columns: 24px 1fr; }
    .entry.task > .card, .entry.event > .card { grid-column: 2; }
    .dot { grid-column: 1; justify-self: start; margin-left: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← ホームに戻る</a>
  <h1 id="page-title">当日までのスケジュール</h1>
  <p class="subtitle" id="page-subtitle">読み込み中...</p>

  <div id="root">
    <div class="loading">スケジュールを読み込んでいます…</div>
  </div>
</div>

<script>
const STATUS_LABEL = { progress: "進行中", todo: "未着手", done: "完了" };

async function loadSchedule() {
  const root = document.getElementById("root");
  try {
    const res = await fetch("schedule.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    document.getElementById("page-title").textContent = data.title || "スケジュール";
    document.getElementById("page-subtitle").textContent = data.subtitle || "";

    const entries = (data.entries || []).slice().sort((a, b) => {
      if (!a.sort || !b.sort) return 0;
      return a.sort.localeCompare(b.sort);
    });

    let html = "";
    html += `<h2 class="year">${escapeHtml(data.year)}年</h2>`;
    html += `<div class="axis-headers">
      <div class="axis-head tasks">タスク</div>
      <div></div>
      <div class="axis-head events">イベント・本番</div>
    </div>`;
    html += `<div class="timeline">`;

    let lastMonth = null;
    for (const e of entries) {
      if (e.month && e.month !== lastMonth) {
        html += `<div class="month-label">${escapeHtml(e.month)}</div>`;
        lastMonth = e.month;
      }
      html += renderEntry(e);
    }
    html += `</div>`;
    root.innerHTML = html;
  } catch (err) {
    root.innerHTML = `<div class="error">スケジュールデータの読み込みに失敗しました: ${escapeHtml(err.message)}</div>`;
    console.error(err);
  }
}

function renderEntry(e) {
  const isEvent = e.type === "event";
  const cls = isEvent ? "event" : "task";
  const tags = [];
  if (isEvent) {
    tags.push(`<span class="tag event">${escapeHtml(e.label || "イベント")}</span>`);
  } else {
    tags.push(`<span class="tag task">タスク</span>`);
    if (e.category) tags.push(`<span class="tag cat">${escapeHtml(e.category)}</span>`);
    if (e.status) tags.push(`<span class="tag ${escapeHtml(e.status)}">${escapeHtml(STATUS_LABEL[e.status] || e.status)}</span>`);
  }
  const desc = isEvent
    ? (e.desc ? `<p class="desc">${escapeHtml(e.desc)}</p>` : "")
    : (e.owner ? `<p class="desc">担当: ${escapeHtml(e.owner)}</p>` : (e.desc ? `<p class="desc">${escapeHtml(e.desc)}</p>` : ""));
  return `
    <div class="entry ${cls}">
      <span class="dot"></span>
      <div class="card">
        <div class="head">
          <span class="head-icon">${escapeHtml(e.icon || (isEvent ? "🎉" : "📌"))}</span>
          <h3 class="head-title">${escapeHtml(e.title || "(無題)")}</h3>
          <span class="head-date">${escapeHtml(e.date || "")}</span>
        </div>
        ${desc}
        <div class="tags">${tags.join("")}</div>
      </div>
    </div>`;
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  }[c]));
}

loadSchedule();
</script>
</body>
</html>
