<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>SPIKES (in IVS) 2026 — 内部ハブ</title>
<style>
  :root {
    --primary: #2e5aa8;
    --primary-dark: #1f3a68;
    --bg: #f6f7fb;
    --card-bg: #fff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
  header { margin-bottom: 40px; }
  h1 { font-size: 28px; margin: 0 0 8px; color: var(--primary-dark); }
  .subtitle { color: var(--muted); margin: 0; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(31, 58, 104, 0.12);
    border-color: var(--primary);
  }
  .card-icon { font-size: 28px; margin-bottom: 12px; display: block; }
  .card-title { font-size: 18px; font-weight: 600; color: var(--primary-dark); margin: 0 0 6px; }
  .card-desc { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
  footer { margin-top: 56px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SPIKES (in IVS) 2026</h1>
    <p class="subtitle">内部ハブ</p>
  </header>

  <div class="cards">
    <a class="card" href="org-chart.html">
      <span class="card-icon">🗂️</span>
      <h2 class="card-title">組織図</h2>
      <p class="card-desc">メンバー構成・ロール階層・企画コンテンツ × 担当者マップ</p>
    </a>
    <a class="card" href="ops.html">
      <span class="card-icon">📋</span>
      <h2 class="card-title">当日オペレーション</h2>
      <p class="card-desc">当日スタッフの役割・担当・タスク詳細</p>
    </a>
  </div>

  <footer>
    <p>元データ: <a href="https://www.notion.so/techweek/34257f3cbb7880e5a7c9fdb76ac4ffc4">Notion</a> ／ <a href="https://docs.google.com/spreadsheets/d/1K-MvzzDbFs6m05ytU3WtkOfGm3vV99TrSTWF5ajYbSU">Google Sheets</a></p>
  </footer>
</div>
</body>
</html>
